name: agri_ledger_app
description: Bhola Traders — offline-first agricultural ledger app for rural India, with Hindi support.
publish_to: none
version: 1.0.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── LOCAL DATABASE (offline-first) ──────────────────────────────
  drift: ^2.14.1
  drift_sqflite: ^2.0.1
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # ── STATE MANAGEMENT ─────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── NETWORKING ───────────────────────────────────────────────────
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # ── VOICE INPUT ──────────────────────────────────────────────────
  speech_to_text: ^7.3.0

  # ── PDF GENERATION + PRINTING ────────────────────────────────────
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  url_launcher: ^6.3.0

  # ── BLUETOOTH THERMAL PRINTER ─────────────────────────────────────
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

  # ── UTILITIES ────────────────────────────────────────────────────
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # ── UI ───────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0
  cached_network_image: ^3.3.1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.11
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
